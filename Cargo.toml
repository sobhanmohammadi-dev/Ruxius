[package]
name = "ruxius"
version = "1.5.0"
edition = "2024"
description = "Ruxius — packages a PHP app into a standalone Windows executable"
authors = ["Ruxius"]
license = "MIT"
repository = "https://github.com/sobhanmohammadi-dev/Ruxius"

[[bin]]
name = "ruxius"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
directories = "5.0"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
tempfile = "3.10"
portpicker = "0.1"
wry = "0.37"
tao = "0.26"
zstd = { version = "0.13", features = ["zstdmt"] }
tar = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
fern = "0.6"
chrono = "0.4"
ctrlc = "3.4"
fs2 = "0.4"
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
] }
winres-edit = "0.2"
